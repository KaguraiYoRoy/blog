name: Build and Deploy Blog

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test deployment scripts
        run: node --test scripts/deploy-cn.test.mjs

      - name: Check Astro
        run: pnpm check

      - name: Build site and search index
        run: pnpm build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  deploy-cn:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download the same artifact used by GitHub Pages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact

      - name: Deploy static files to the mainland server
        env:
          DEPLOY_CN_HOST: ${{ secrets.DEPLOY_CN_HOST }}
          DEPLOY_CN_PORT: ${{ secrets.DEPLOY_CN_PORT || '22' }}
          DEPLOY_CN_USER: ${{ secrets.DEPLOY_CN_USER }}
          DEPLOY_CN_SSH_KEY: ${{ secrets.DEPLOY_CN_SSH_KEY }}
          DEPLOY_CN_KNOWN_HOSTS: ${{ secrets.DEPLOY_CN_KNOWN_HOSTS }}
          DEPLOY_CN_PATH: ${{ secrets.DEPLOY_CN_PATH }}
          DEPLOY_CN_LINK_NAME: ${{ secrets.DEPLOY_CN_LINK_NAME || 'current' }}
        run: |
          bash scripts/deploy-cn.sh \
            "$RUNNER_TEMP/pages-artifact/artifact.tar" \
            "$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
